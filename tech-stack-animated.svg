<svg width="560" height="670" viewBox="0 0 560 670"
  xmlns="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .title {
        fill: #58a6ff;
        font-family: 'Segoe UI', Verdana, sans-serif;
        font-weight: 700;
        font-size: 17px;
        text-anchor: middle;
      }

```
  .label {
    fill: #c9d1d9;
    font-family: 'Segoe UI', Verdana, sans-serif;
    font-size: 13px;
    text-anchor: middle;
  }

  .float {
    transform-box: fill-box;
    transform-origin: center;
    animation: float 2.2s ease-in-out infinite;
  }

  .d1 { animation-delay: 0s; }
  .d2 { animation-delay: .18s; }
  .d3 { animation-delay: .36s; }
  .d4 { animation-delay: .54s; }
  .d5 { animation-delay: .72s; }
  .d6 { animation-delay: .90s; }

  @keyframes float {
    0%, 100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-6px);
    }
  }
</style>
```

  </defs>

  <!-- Background -->

  <rect width="560" height="670" fill="#0a0e14"/>

